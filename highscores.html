<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Startie – Highscores</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-banner">
  <div id="banner-wrapper">
    <div id="banner-left"></div>
    <div id="banner-center">
      <img src="./assets/top-banner.png" alt="StartSchool LOGIC RUN" id="banner-img">
    </div>
    <div id="banner-right"></div>
  </div>
</div>

<div id="highscores-container">
  <div id="highscores-content">
    <h1>HIGHSCORES</h1>
    
    <div id="score-entry" style="display: none;">
      <h2>Enter Your Code</h2>
      <p style="color: #888; margin-bottom: 20px;">Your total score: <strong id="total-score-display">0</strong></p>
      <input type="text" id="player-code" placeholder="3 letters/numbers" maxlength="3" pattern="[A-Za-z0-9]{3}" style="text-transform: uppercase;">
      <button id="submit-score">Submit</button>
      <div id="code-error" style="color: #ff4444; margin-top: 10px; min-height: 20px;"></div>
    </div>
    
    <div id="leaderboard-display">
      <h2>Top Scores</h2>
      <div id="leaderboard-list"></div>
    </div>
    
    <div id="highscores-actions">
      <button id="home-btn-highscore" class="highscore-btn">Home</button>
      <button id="play-again-btn" class="highscore-btn">Play Again</button>
    </div>
  </div>
</div>

<script type="module">
// Initialize Supabase
import { initSupabase } from './utils/supabase.js';
import { getCumulativeLeaderboard, saveCumulativeScore, getCurrentRunTotal, resetRunTotal } from './utils/leaderboard-supabase.js';
import { saveMusicPosition } from './utils/sounds.js';

// Initialize Supabase when page loads
initSupabase();

const scoreEntry = document.getElementById('score-entry');
const playerCodeInput = document.getElementById('player-code');
const submitScoreBtn = document.getElementById('submit-score');
const codeError = document.getElementById('code-error');
const totalScoreDisplay = document.getElementById('total-score-display');
const leaderboardList = document.getElementById('leaderboard-list');

// Get total score from URL parameter or localStorage
const urlParams = new URLSearchParams(window.location.search);
const totalScore = urlParams.get('score') ? parseInt(urlParams.get('score'), 10) : getCurrentRunTotal();

// Display total score
totalScoreDisplay.textContent = totalScore.toLocaleString();

// Show score entry if there's a score to submit
if (totalScore > 0) {
  scoreEntry.style.display = 'block';
}

// Update leaderboard display (now async)
async function updateLeaderboard() {
  const leaderboard = await getCumulativeLeaderboard();
  leaderboardList.innerHTML = '';
  
  if (leaderboard.length === 0) {
    leaderboardList.innerHTML = '<p style="color: #888;">No scores yet. Be the first!</p>';
    return;
  }
  
  leaderboard.forEach((entry, index) => {
    const entryDiv = document.createElement('div');
    entryDiv.className = 'highscore-entry';
    entryDiv.innerHTML = `
      <span class="highscore-code">${entry.code}</span>
      <span class="highscore-score">${entry.score.toLocaleString()}</span>
    `;
    leaderboardList.appendChild(entryDiv);
  });
}

// Submit score (now async)
submitScoreBtn.onclick = async () => {
  const code = playerCodeInput.value.trim().toUpperCase();
  codeError.textContent = '';
  
  if (code.length !== 3) {
    codeError.textContent = 'Code must be 3 characters';
    return;
  }
  
  if (!/^[A-Z0-9]{3}$/.test(code)) {
    codeError.textContent = 'Code must be letters or numbers only';
    return;
  }
  
  // Disable button during submission
  submitScoreBtn.disabled = true;
  submitScoreBtn.textContent = 'Submitting...';
  
  try {
    await saveCumulativeScore(code, totalScore);
    resetRunTotal();
    scoreEntry.style.display = 'none';
    await updateLeaderboard();
  } catch (error) {
    console.error('Error submitting score:', error);
    codeError.textContent = 'Error submitting score. Please try again.';
  } finally {
    submitScoreBtn.disabled = false;
    submitScoreBtn.textContent = 'Submit';
  }
};

// Allow Enter key to submit
playerCodeInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    submitScoreBtn.click();
  }
});

// Auto-uppercase input
playerCodeInput.addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase();
});

// Navigation
document.getElementById('home-btn-highscore').onclick = () => {
  saveMusicPosition();
  resetRunTotal();
  window.location.href = 'index.html';
};

document.getElementById('play-again-btn').onclick = () => {
  saveMusicPosition();
  resetRunTotal();
  window.location.href = 'levels/MVE.html';
};

// Initialize
updateLeaderboard();
</script>

<style>
#highscores-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  max-width: 600px;
  margin: 0 auto;
}

#highscores-content {
  width: 100%;
  background: var(--ui-gray);
  padding: 2rem;
  border: 2px solid var(--pink);
}

#highscores-content h1 {
  color: var(--white);
  text-align: center;
  margin-bottom: 2rem;
  font-family: 'Courier New', monospace;
  font-size: 2rem;
}

#highscores-content h2 {
  color: var(--white);
  margin-top: 0;
  margin-bottom: 1rem;
  font-family: 'Courier New', monospace;
}

#player-code {
  width: 100%;
  padding: 0.75rem;
  margin: 1rem 0;
  background: var(--black);
  border: 1px solid #555;
  color: var(--white);
  font-family: 'Courier New', monospace;
  font-size: 1.5rem;
  text-align: center;
  letter-spacing: 0.5rem;
  text-transform: uppercase;
}

#player-code:focus {
  outline: none;
  border-color: var(--pink);
}

#submit-score {
  width: 100%;
  padding: 0.75rem;
  background: var(--pink);
  border: none;
  color: var(--white);
  font-weight: bold;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 1rem;
  margin-top: 1rem;
}

#submit-score:hover {
  background: #ff6fb8;
}

#leaderboard-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 2rem 0;
  min-height: 200px;
}

#highscores-actions {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
}

.highscore-btn {
  flex: 1;
  padding: 0.75rem;
  background: var(--pink);
  border: none;
  color: var(--white);
  font-weight: bold;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 1rem;
}

.highscore-btn:hover {
  background: #ff6fb8;
}
</style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Startie – Level 7</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-banner">
  <div id="banner-wrapper">
    <div id="banner-left"></div>
    <div id="banner-center">
      <img src="../assets/top-banner.png" alt="StartSchool LOGIC RUN" id="banner-img">
    </div>
    <div id="banner-right"></div>
  </div>
</div>

<!-- Mobile Header -->
<div id="mobile-header">
  <div id="mobile-nav-buttons">
    <button id="mobile-home-btn" class="mobile-nav-btn home" title="Home"></button>
    <button id="mobile-prev-btn" class="mobile-nav-btn prev" title="Previous Level"></button>
    <button id="mobile-password-btn" class="mobile-nav-btn password" title="Enter Password">*</button>
  </div>
</div>

<div id="game-container">
  <div id="game">
    <canvas id="canvas" width="600" height="300"></canvas>
  </div>
  
  <div id="ui">
    <div id="ui-header">
      <strong>Level 7</strong> <span style="font-size: 14px; color: #888; margin-left: 10px;">pass: PTN</span>
      <div style="display: flex; align-items: center;">
        <span id="score">SCORE: 1000</span>
        <button id="sound-toggle" title="Toggle Sound">🔊</button>
      </div>
    </div>
    <div id="terminal-container">
      <textarea id="terminal" spellcheck="false">> move()</textarea>
      <div id="terminal-drop-zone" class="empty"></div>
    </div>
    <button id="run">Run</button>
    <div id="status"></div>
  </div>
  
  <div id="highscores-panel">
    <h2>HIGHSCORES</h2>
    <div id="highscores-list"></div>
  </div>
</div>

<div id="nav-buttons">
  <button id="home-btn" class="nav-btn" title="Home"></button>
  <button id="prev-btn" class="nav-btn" title="Previous Level"></button>
  <button id="password-btn" class="nav-btn" title="Enter Password">*</button>
</div>

<!-- Mobile Command Palette -->
<div id="command-palette">
  <button class="command-btn" draggable="true" data-command="move()">move()</button>
  <button class="command-btn" draggable="true" data-command="spin(l)">spin(l)</button>
  <button class="command-btn" draggable="true" data-command="spin(r)">spin(r)</button>
  <button class="command-btn" draggable="true" data-command="jump()">jump()</button>
</div>

<!-- Password Modal -->
<div id="password-modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Enter Level Password</h2>
    <input type="text" id="password-input" placeholder="Password">
    <button id="password-submit">Go</button>
    <div id="password-error"></div>
  </div>
</div>

<script type="module">
import { createEngine, calculateScore, countCommands } from '../engine/index.js';
import { drawLevel, initRenderer } from '../render/index.js';
import { level7 } from './level7.js';
import { animateCelebration } from '../render/animations.js';
import { initSounds, loadSoundPreference, toggleSound, isSoundEnabled, playBackgroundMusic, saveMusicPosition } from '../utils/sounds.js';
import { initSupabase } from '../utils/supabase.js';
import { getCumulativeLeaderboard, addToRunTotal } from '../utils/leaderboard-supabase.js';

const level = level7;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const engine = createEngine(level);
const status = document.getElementById('status');
const scoreDisplay = document.getElementById('score');
const terminal = document.getElementById('terminal');

// Initialize sounds
loadSoundPreference();
initSounds();

// Start background music automatically when level loads (continues from previous level)
playBackgroundMusic();

// Sound toggle button
const soundToggle = document.getElementById('sound-toggle');
function updateSoundButton() {
  soundToggle.textContent = isSoundEnabled() ? '🔊' : '🔇';
  soundToggle.classList.toggle('muted', !isSoundEnabled());
}
updateSoundButton();

soundToggle.onclick = () => {
  toggleSound();
  updateSoundButton();
};

// Terminal input formatting
function formatTerminalLines() {
  const lines = terminal.value.split('\n');
  const formatted = lines.map(line => {
    const trimmed = line.trim();
    if (trimmed === '') return '> ';
    if (trimmed.startsWith('>')) return trimmed;
    return '> ' + trimmed;
  });
  const newValue = formatted.join('\n');
  if (newValue !== terminal.value) {
    const cursorPos = terminal.selectionStart;
    terminal.value = newValue;
    terminal.setSelectionRange(cursorPos, cursorPos);
  }
}

// Handle Enter key - add > to new line
terminal.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const start = terminal.selectionStart;
    const end = terminal.selectionEnd;
    const text = terminal.value;
    const before = text.substring(0, start);
    const after = text.substring(end);
    terminal.value = before + '\n> ' + after;
    terminal.setSelectionRange(start + 3, start + 3);
  }
  
  // Handle Backspace at start of line - delete the line
  if (e.key === 'Backspace') {
    const start = terminal.selectionStart;
    const text = terminal.value;
    if (start >= 2 && text.substring(start - 2, start) === '> ') {
      const beforeCursor = text.substring(0, start - 2);
      if (beforeCursor.endsWith('\n') || beforeCursor === '') {
        e.preventDefault();
        const lineStart = text.substring(0, start - 2).lastIndexOf('\n') + 1;
        const lineEnd = text.indexOf('\n', start);
        const endPos = lineEnd === -1 ? text.length : lineEnd + 1;
        if (lineStart > 0) {
          terminal.value = text.substring(0, lineStart - 1) + text.substring(endPos);
          terminal.setSelectionRange(lineStart - 1, lineStart - 1);
        } else if (endPos < text.length) {
          terminal.value = text.substring(endPos);
          terminal.setSelectionRange(0, 0);
        }
      }
    }
  }
});

terminal.addEventListener('input', formatTerminalLines);

// Real-time score calculation
function updateScore() {
  const text = terminal.value;
  const lines = text.trim()
    .split('\n')
    .map(l => l.trim().replace(/^>\s*/, ''))
    .filter(l => l);
  
  if (lines.length === 0) {
    scoreDisplay.textContent = 'SCORE: 1000';
    return;
  }
  
  const result = engine.parse(lines.join('\n'));
  if (result.error || !result.actions) {
    scoreDisplay.textContent = 'SCORE: 1000';
    return;
  }
  
  const commandCount = countCommands(result.actions);
  const score = calculateScore(commandCount);
  scoreDisplay.textContent = `SCORE: ${score}`;
}

terminal.addEventListener('input', updateScore);
updateScore(); // Initialize score

// Initialize game state
engine.state.x = level.start.x;
engine.state.y = level.start.y;
engine.state.z = 0;
engine.state.facing = 'SE';
engine.state.hasLaptop = false;

// Initialize renderer
initRenderer(() => {
  drawLevel(ctx, level, engine.state);
}, level);
drawLevel(ctx, level, engine.state);

// Initialize Supabase
initSupabase();

// Initialize highscores panel
async function updateHighscoresPanel() {
  const leaderboard = await getCumulativeLeaderboard();
  const highscoresList = document.getElementById('highscores-list');
  highscoresList.innerHTML = '';
  
  if (leaderboard.length === 0) {
    highscoresList.innerHTML = '<div style="color: #888; font-size: 0.8rem; text-align: center; padding: 1rem;">No scores yet</div>';
    return;
  }
  
  leaderboard.forEach((entry) => {
    const entryDiv = document.createElement('div');
    entryDiv.className = 'highscore-entry';
    entryDiv.innerHTML = `
      <span class="highscore-code">${entry.code}</span>
      <span class="highscore-score">${entry.score.toLocaleString()}</span>
    `;
    highscoresList.appendChild(entryDiv);
  });
}

updateHighscoresPanel();

const runButton = document.getElementById('run');
let isRunning = false;

runButton.onclick = () => {
  if (isRunning) return; // Prevent multiple clicks
  
  status.textContent = '';
  
  // Check if mobile - use commands array, otherwise use terminal value
  const isMobile = window.innerWidth <= 768 || ('ontouchstart' in window);
  let commandText;
  
  if (isMobile && terminalDropZone) {
    commandText = commands.join('\n');
  } else {
    const lines = terminal.value.split('\n')
      .map(line => line.trim().replace(/^>\s*/, ''))
      .filter(text => text.length > 0);
    commandText = lines.join('\n');
  }
  
  if (!commandText.trim()) {
    status.textContent = 'No commands to execute';
    return;
  }
  
  const result = engine.parse(commandText);
  if (result.error) {
    status.textContent = result.error;
    return;
  }

  if (!result.actions || result.actions.length === 0) {
    status.textContent = 'No commands to execute';
    return;
  }

  isRunning = true;
  runButton.disabled = true;
  runButton.textContent = 'Running...';

  engine.execute(result.actions, s => drawLevel(ctx, level, s), s => {
    isRunning = false;
    runButton.disabled = false;
    runButton.textContent = 'Run';
    
    if (s.failed) {
      status.textContent = 'Game Over — Try Again';
    } else if (s.x === level.goal.x && s.y === level.goal.y) {
      const commandCount = countCommands(result.actions);
      const score = calculateScore(commandCount);
      scoreDisplay.textContent = `SCORE: ${score}`;
      
      // Add to cumulative run total
      addToRunTotal(score);
      
      status.textContent = '✓ Level Complete';
      
      // Disable button during celebration
      runButton.disabled = true;
      animateCelebration(s, (state) => drawLevel(ctx, level, state), 1500);
      saveMusicPosition(); // Save position before navigation
      setTimeout(() => window.location.href = 'GLS.html', 2000);
    } else {
      status.textContent = 'Try again';
    }
  });
};

// Save music position before page unload
window.addEventListener('beforeunload', () => {
  saveMusicPosition();
});

// Navigation
document.getElementById('home-btn').onclick = () => {
  saveMusicPosition();
  window.location.href = '../index.html';
};

document.getElementById('prev-btn').onclick = () => {
  saveMusicPosition();
  window.location.href = 'PTN.html';
};

document.getElementById('password-btn').onclick = () => {
  document.getElementById('password-modal').style.display = 'block';
};

// Mobile navigation
const mobileHomeBtn = document.getElementById('mobile-home-btn');
const mobilePrevBtn = document.getElementById('mobile-prev-btn');
const mobilePasswordBtn = document.getElementById('mobile-password-btn');

if (mobileHomeBtn) {
  mobileHomeBtn.onclick = () => {
    saveMusicPosition();
    window.location.href = '../index.html';
  };
}

if (mobilePrevBtn) {
  mobilePrevBtn.onclick = () => {
    saveMusicPosition();
    window.location.href = 'PTN.html';
  };
}

if (mobilePasswordBtn) {
  mobilePasswordBtn.onclick = () => {
    document.getElementById('password-modal').style.display = 'block';
  };
}

// Mobile drag-and-drop command interface
const terminalDropZone = document.getElementById('terminal-drop-zone');
let commands = []; // Array to store dropped commands

// Check if mobile (touch device or small screen)
const isMobileDevice = window.innerWidth <= 768 || ('ontouchstart' in window);

function updateTerminalFromCommands() {
  if (!isMobileDevice) return;
  
  // Update textarea with commands
  if (terminal && commands.length > 0) {
    terminal.value = commands.map(cmd => `> ${cmd}`).join('\n');
  } else if (terminal) {
    terminal.value = '';
  }
  
  // Update drop zone display
  if (terminalDropZone) {
    terminalDropZone.classList.toggle('empty', commands.length === 0);
    terminalDropZone.innerHTML = '';
    
    commands.forEach((cmd, index) => {
      const chip = document.createElement('div');
      chip.className = 'command-chip';
      // Chip is not draggable - only palette buttons can be dragged
      chip.dataset.index = index;
      
      // Check if command is spin(l) or spin(r) - these don't need parameter input
      const isSpinDirection = cmd === 'spin(l)' || cmd === 'spin(r)';
      
      if (isSpinDirection) {
        // Render spin(l) or spin(r) without parameter input
        chip.innerHTML = `
          <span class="command-text">${cmd}</span>
          <button class="remove-btn" data-index="${index}">×</button>
        `;
        
        const removeBtn = chip.querySelector('.remove-btn');
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          commands.splice(index, 1);
          updateTerminalFromCommands();
          updateScoreMobile();
        };
      } else {
        // Parse command to extract base and parameter
        const match = cmd.match(/^(\w+)\((\d*)\)$/);
        const baseCmd = match ? match[1] : cmd.replace(/\(.*\)/, '');
        const param = match ? match[2] : '';
        
        chip.innerHTML = `
          <span class="command-text">${baseCmd}(</span>
          <input type="text" class="command-param" value="${param}" data-index="${index}" inputmode="numeric" pattern="[0-9]*" maxlength="2">
          <span class="command-text">)</span>
          <button class="remove-btn" data-index="${index}">×</button>
        `;
        
        const paramInput = chip.querySelector('.command-param');
        const removeBtn = chip.querySelector('.remove-btn');
        
        // Update command when parameter changes
        paramInput.addEventListener('input', (e) => {
          const newParam = e.target.value.replace(/[^0-9]/g, ''); // Only allow numbers
          e.target.value = newParam;
          const newCmd = newParam ? `${baseCmd}(${newParam})` : `${baseCmd}()`;
          commands[index] = newCmd;
          updateTerminalFromCommands();
          updateScoreMobile();
        });
        
        paramInput.addEventListener('blur', () => {
          // Ensure the command is valid on blur
          const param = paramInput.value.replace(/[^0-9]/g, '');
          const newCmd = param ? `${baseCmd}(${param})` : `${baseCmd}()`;
          commands[index] = newCmd;
          updateTerminalFromCommands();
        });
        
        // Focus input when chip is tapped (but not when clicking remove button)
        chip.addEventListener('click', (e) => {
          if (e.target !== removeBtn && e.target !== paramInput) {
            paramInput.focus();
            // Select all text for easy replacement
            setTimeout(() => paramInput.select(), 10);
          }
        });
        
        // Auto-select on focus for easy typing
        paramInput.addEventListener('focus', () => {
          paramInput.select();
        });
        
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          commands.splice(index, 1);
          updateTerminalFromCommands();
          updateScoreMobile();
        };
      }
      
      // Chips are not draggable - only buttons can be dragged into terminal
      chip.dataset.index = index;
      terminalDropZone.appendChild(chip);
    });
  }
}

function updateScoreMobile() {
  if (!isMobileDevice) return;
  
  const text = commands.join('\n');
  const lines = text.trim().split('\n').filter(l => l);
  
  if (lines.length === 0) {
    scoreDisplay.textContent = 'SCORE: 1000';
    return;
  }
  
  const result = engine.parse(lines.join('\n'));
  if (result.error || !result.actions) {
    scoreDisplay.textContent = 'SCORE: 1000';
    return;
  }
  
  const commandCount = countCommands(result.actions);
  const score = calculateScore(commandCount);
  scoreDisplay.textContent = `SCORE: ${score}`;
}

// Command palette functionality for mobile (tap to add - primary method)
if (isMobileDevice && terminalDropZone) {
  const commandButtons = document.querySelectorAll('.command-btn');
  
  // Primary method: tap/click to add (works best on mobile)
  commandButtons.forEach(btn => {
    // Use click event (works for both mouse and touch)
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const command = btn.dataset.command;
      if (command) {
        commands.push(command);
        updateTerminalFromCommands();
        updateScoreMobile();
        
        // Visual feedback
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => {
          btn.style.transform = '';
        }, 150);
      }
    });
    
    // Touch-based drag from button for mobile
    let btnTouchStartY = 0;
    let btnTouchStartX = 0;
    let btnIsDragging = false;
    
    btn.addEventListener('touchstart', (e) => {
      btnTouchStartY = e.touches[0].clientY;
      btnTouchStartX = e.touches[0].clientX;
      btnIsDragging = false;
    }, { passive: true });
    
    btn.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const touchX = e.touches[0].clientX;
      const deltaY = Math.abs(touchY - btnTouchStartY);
      const deltaX = Math.abs(touchX - btnTouchStartX);
      
      if ((deltaY > 10 || deltaX > 10) && !btnIsDragging) {
        btnIsDragging = true;
        btn.classList.add('dragging');
        if (e.cancelable) {
          e.preventDefault();
        }
      }
      
      if (btnIsDragging) {
        if (e.cancelable) {
          e.preventDefault();
        }
        const rect = terminalDropZone.getBoundingClientRect();
        if (touchY >= rect.top && touchY <= rect.bottom) {
          const chips = Array.from(terminalDropZone.querySelectorAll('.command-chip'));
          chips.forEach(c => c.classList.remove('drag-over'));
          
          chips.forEach((c) => {
            const cRect = c.getBoundingClientRect();
            if (touchY >= cRect.top && touchY <= cRect.bottom) {
              c.classList.add('drag-over');
            }
          });
          
          terminalDropZone.style.borderColor = '#0f0';
        } else {
          terminalDropZone.style.borderColor = '#555';
          document.querySelectorAll('.command-chip').forEach(c => c.classList.remove('drag-over'));
        }
      }
    }, { passive: false });
    
    btn.addEventListener('touchend', (e) => {
      if (btnIsDragging) {
        btn.classList.remove('dragging');
        const touchY = e.changedTouches[0].clientY;
        const rect = terminalDropZone.getBoundingClientRect();
        
        if (touchY >= rect.top && touchY <= rect.bottom) {
          const chips = Array.from(terminalDropZone.querySelectorAll('.command-chip'));
          let insertIndex = commands.length;
          
          chips.forEach((c) => {
            const cRect = c.getBoundingClientRect();
            if (touchY >= cRect.top && touchY <= cRect.bottom) {
              insertIndex = parseInt(c.dataset.index);
            }
          });
          
          const command = btn.dataset.command;
          commands.splice(insertIndex, 0, command);
          updateTerminalFromCommands();
          updateScoreMobile();
        }
        
        terminalDropZone.style.borderColor = '#555';
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        if (e.cancelable) {
          e.preventDefault();
        }
      }
      btnIsDragging = false;
    }, { passive: false });
    
    // Also support HTML5 drag-and-drop (for desktop/tablet)
    btn.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', btn.dataset.command);
      e.dataTransfer.setData('type', 'button');
      btn.classList.add('dragging');
    });
    
    btn.addEventListener('dragend', (e) => {
      btn.classList.remove('dragging');
    });
  });

  // Drag and drop support for reordering and adding commands
  let dragOverIndex = -1;
  
  terminalDropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    const chip = e.target.closest('.command-chip');
    if (chip && chip.dataset.index !== undefined) {
      const index = parseInt(chip.dataset.index);
      if (dragOverIndex !== index) {
        document.querySelectorAll('.command-chip').forEach(c => c.classList.remove('drag-over'));
        chip.classList.add('drag-over');
        dragOverIndex = index;
      }
    } else {
      terminalDropZone.style.borderColor = '#0f0';
    }
  });

  terminalDropZone.addEventListener('dragleave', (e) => {
    if (!terminalDropZone.contains(e.relatedTarget)) {
      terminalDropZone.style.borderColor = '#555';
      document.querySelectorAll('.command-chip').forEach(c => c.classList.remove('drag-over'));
      dragOverIndex = -1;
    }
  });

  terminalDropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    terminalDropZone.style.borderColor = '#555';
    document.querySelectorAll('.command-chip').forEach(c => c.classList.remove('drag-over'));
    
    const command = e.dataTransfer.getData('text/plain');
    const dragType = e.dataTransfer.getData('type');
    const dragIndex = e.dataTransfer.getData('index');
    
    const chip = e.target.closest('.command-chip');
    
    if (dragType === 'chip' && dragIndex !== undefined) {
      // Reordering: moving a chip to a new position
      const fromIndex = parseInt(dragIndex);
      const toIndex = chip ? parseInt(chip.dataset.index) : commands.length;
      
      if (fromIndex !== toIndex && fromIndex >= 0 && toIndex >= 0) {
        const [moved] = commands.splice(fromIndex, 1);
        const insertIndex = toIndex > fromIndex ? toIndex - 1 : toIndex;
        commands.splice(insertIndex, 0, moved);
        updateTerminalFromCommands();
        updateScoreMobile();
      }
    } else if (command) {
      // Adding new command from button
      if (chip) {
        const insertIndex = parseInt(chip.dataset.index);
        commands.splice(insertIndex, 0, command);
      } else {
        commands.push(command);
      }
      updateTerminalFromCommands();
      updateScoreMobile();
    }
    
    dragOverIndex = -1;
  });

  // Initialize
  updateTerminalFromCommands();
}

// Password system - includes all levels
const passwordModal = document.getElementById('password-modal');
const closeBtn = document.querySelector('.close');
const passwordSubmit = document.getElementById('password-submit');

const passwords = {
  'mve': 'MVE.html',
  'jmp': 'JMP.html',
  'spn': 'SPN.html',
  'hgt': 'HGT.html',
  'hck': 'HCK.html',
  'ptn': 'SSS.html',
  'sss': 'PTN.html',
  'gls': 'GLS.html',
  'lop': 'LOP.html',
  'fin': 'FIN.html'
};

closeBtn.onclick = () => {
  passwordModal.style.display = 'none';
};

window.onclick = (e) => {
  if (e.target === passwordModal) {
    passwordModal.style.display = 'none';
  }
};

passwordSubmit.onclick = () => {
  const password = document.getElementById('password-input').value.trim().toLowerCase();
  const errorDiv = document.getElementById('password-error');
  
  if (passwords[password]) {
    saveMusicPosition();
    window.location.href = passwords[password];
  } else {
    errorDiv.textContent = 'Incorrect password';
  }
};
</script>
</body>
</html>
